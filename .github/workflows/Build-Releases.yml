name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build release images
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            gcc-arm-none-eabi \
            libncurses-dev \
            pkg-config \
            ripgrep

      - name: Install Xuantie RISC-V toolchain
        env:
          TOOLCHAIN_URL: https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/resource//1751370399722/Xuantie-900-gcc-elf-newlib-x86_64-V3.2.0-20250627.tar.gz
          TOOLCHAIN_SHA256: 80c174c6445f7565bc082d328045021862a63beddfad8c393c534e2d9523dc3b
        run: |
          archive="${RUNNER_TEMP}/xuantie-toolchain.tar.gz"
          mkdir -p "${RUNNER_TEMP}/xuantie"
          curl --fail --location --retry 3 --output "${archive}" \
            "${TOOLCHAIN_URL}"
          echo "${TOOLCHAIN_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --strip-components=1 \
            --directory "${RUNNER_TEMP}/xuantie" --file "${archive}"
          toolchain="${RUNNER_TEMP}/xuantie/bin/riscv64-unknown-elf-"
          "${toolchain}gcc" --version | grep -F \
            'Xuantie-900 elf newlib gcc Toolchain V3.2.0 B-20250627'
          echo "RISCV_CROSS_COMPILE=${RUNNER_TEMP}/xuantie/bin/riscv64-unknown-elf-" \
            >> "${GITHUB_ENV}"

      - name: Build and package release images
        env:
          ARM_CROSS_COMPILE: arm-none-eabi-
          RELEASE_ROOT: ${{ runner.temp }}/syterkit-release
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_ROOT}/assets"
          built=0

          for defconfig in configs/*_defconfig; do
            test -f "${defconfig}"
            built=1
            config="${defconfig##*/}"
            config_name="${config%_defconfig}"
            output="${RELEASE_ROOT}/build/${config_name}"

            make "O=${output}" "${config}"
            if grep -q '^CONFIG_ARCH_RISCV' "${output}/.config"; then
              cross="${RISCV_CROSS_COMPILE}"
            else
              cross="${ARM_CROSS_COMPILE}"
            fi
            make "O=${output}" CROSS_COMPILE="${cross}" -j"$(nproc)"

            board="$(sed -n 's/^CONFIG_SYS_BOARD="\([^"]*\)"$/\1/p' \
              "${output}/.config")"
            test -n "${board}"
            image_dir="${output}/build/${board}"
            test -d "${image_dir}"
            test -n "$(find "${image_dir}" -type f -print -quit)"
            tar --create --gzip \
              --file="${RELEASE_ROOT}/assets/${config_name}.tar.gz" \
              --directory="${image_dir}" .
          done

          test "${built}" -eq 1
          printf 'Release assets:\n'
          find "${RELEASE_ROOT}/assets" -maxdepth 1 -type f -name '*.tar.gz' \
            -printf '%f\n' | sort

      - name: Upload release assets
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ github.event.release.id }}
          file: "${{ runner.temp }}/syterkit-release/assets/*.tar.gz"
          draft: false

      - name: Roll back release on failure
        if: failure() && github.event.release.id != ''
        uses: author/action-rollback@stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ github.event.release.id }}
