image boot.vfat {
	vfat {
		files = {
			"Image",
			"sunxi.dtb",
			"../boards/avaota-a1/syter_boot_bl33/bl31/bl31.bin",
			"../utils/bl33_t527/output/syter_bl33.bin"
		}
	}
	size = 128M
}

image sdcard.img {
	hdimage {}

	partition boot0 {
		in-partition-table = "no"
		image = "../build/avaota-a1/syter_boot_bl33/syter_boot_bl33_card.bin"
		offset = 8K
	}

	partition boot0-gpt {
		in-partition-table = "no"
		image = "../build/avaota-a1/syter_boot_bl33/syter_boot_bl33_card.bin"
		offset = 128K
	}

	partition kernel {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	
	partition rootfs {
		partition-type = 0xC
		image = "rootfs.ext4"
	}
	
	partition rootfs_data {
		size = 128M
	}
}
