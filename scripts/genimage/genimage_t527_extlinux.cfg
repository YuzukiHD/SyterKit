image boot.vfat {
	vfat {
		files = {
			"Image",
			"sunxi.dtb",
			"../boards/avaota-a1/extlinux_boot/bl31/bl31.bin",
			"../boards/avaota-a1/extlinux_boot/scp/scp.bin",
			"../boards/avaota-a1/extlinux_boot/extlinux",
			"../boards/avaota-a1/extlinux_boot/splash/splash.bin"
		}
	}
	size = 128M
}

image sdcard.img {
	hdimage {}

	partition boot0 {
		in-partition-table = "no"
		image = "../build/avaota-a1/extlinux_boot/extlinux_boot_card.bin"
		offset = 8K
	}

	partition boot0-gpt {
		in-partition-table = "no"
		image = "../build/avaota-a1/extlinux_boot/extlinux_boot_card.bin"
		offset = 128K
	}

	partition kernel {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
}
