image boot.vfat {
	vfat {
		files = {
			"../boards/avaota-a1/syter_boot_uboot/bl31/bl31.bin",
			"../boards/avaota-a1/syter_boot_uboot/scp/scp.bin",
			"../boards/avaota-a1/syter_boot_uboot/uboot/u-boot.bin"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {}

	partition boot0 {
		in-partition-table = "no"
		image = "../build/avaota-a1/syter_boot_uboot/syter_boot_uboot_card.bin"
		offset = 8K
	}

	partition boot0-gpt {
		in-partition-table = "no"
		image = "../build/avaota-a1/syter_boot_uboot/syter_boot_uboot_card.bin"
		offset = 128K
	}

	partition kernel {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
}
