$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner RISC-V platform-level interrupt controller used by SyterKit

properties:
  compatible:
    const: allwinner,sunxi-plic
  reg:
    type: reg
  interrupt-controller:
    type: boolean
  "#interrupt-cells":
    type: uint32
  riscv,num-sources:
    type: uint32
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"
  - riscv,num-sources

dt2c,device: true
