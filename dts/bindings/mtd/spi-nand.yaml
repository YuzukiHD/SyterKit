$schema: http://devicetree.org/meta-schemas/core.yaml#
title: SPI NAND flash used by SyterKit

properties:
  compatible:
    const: spi-nand
  reg:
    type: uint32-array
  spi-max-frequency:
    type: uint32
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - spi-max-frequency

dt2c,device: true
