$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner sun300iw1 clock controller used by SyterKit

properties:
  compatible:
    const: allwinner,sun300iw1-ccu
  reg:
    type: reg
  reg-names:
    type: string-array
    const: [app-ccu, aon-ccu]
    description: Ordered as app-ccu, aon-ccu.
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - reg-names

dt2c,device: true
