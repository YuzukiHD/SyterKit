$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner sun55iw6 clock controller used by SyterKit

properties:
  compatible:
    const: allwinner,sun55iw6-ccu
  reg:
    type: reg
  reg-names:
    type: string-array
    const: [ccu, cpu-pll]
    description: Ordered as ccu, cpu-pll.
  status:
    type: string
    enum: [okay, disabled]

required: [compatible, reg, reg-names]
dt2c,device: true
