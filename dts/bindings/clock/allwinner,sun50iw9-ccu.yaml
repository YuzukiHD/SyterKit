$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner sun50iw9 clock controller used by SyterKit

properties:
  compatible:
    const: allwinner,sun50iw9-ccu
  reg:
    type: reg
  reg-names:
    type: string-array
    const: [ccu, r-prcm, iommu]
    description: Ordered as ccu, r-prcm, iommu.
  status:
    type: string
    enum: [okay, disabled]

required: [compatible, reg, reg-names]
dt2c,device: true
