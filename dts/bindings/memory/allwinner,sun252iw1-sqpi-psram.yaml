# SPDX-License-Identifier: MIT
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner sun252iw1 SQPI PSRAM controller

description: |
  SPI PSRAM with 24-bit addresses and 1-4-4 mapped reads and writes.
  reg contains the controller registers followed by the CPU memory window.
  The module clock tuple is register address, source selection, parent rate
  in Hz. Source 0 is HOSC (24 MHz), 1/2/3 is PERI 480/400/300 MHz; the caller
  must make a selected PLL parent available before initialization.
  Pin order is CS, CLK, IO0, IO1, IO2, IO3. Capacity is expressed in bytes
  and checked against the device ID. Supported densities are 2/4/8 MiB.

properties:
  compatible:
    const: allwinner,sun252iw1-sqpi-psram
  reg:
    type: reg
  allwinner,module-clock:
    type: uint32-array
  allwinner,clock-gate:
    type: uint32-array
  allwinner,reset:
    type: uint32-array
  clock-frequency:
    type: uint32
  allwinner,capacity:
    type: uint32
  pinctrl-names:
    type: string
  pinctrl-0:
    type: phandle
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - allwinner,module-clock
  - allwinner,clock-gate
  - allwinner,reset
  - clock-frequency
  - allwinner,capacity
  - pinctrl-names
  - pinctrl-0

dt2c,device: true
