$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner I2C controller used by SyterKit

properties:
  compatible:
    const: allwinner,sunxi-i2c
  reg:
    type: reg
  clock-frequency:
    type: uint32
  allwinner,i2c-id:
    type: uint32
  allwinner,parent-clock-frequency:
    type: uint32
  allwinner,clock-gate:
    type: uint32-array
  allwinner,reset:
    type: uint32-array
  pinctrl-names:
    type: string
  pinctrl-0:
    type: phandle
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - clock-frequency
  - allwinner,i2c-id
  - allwinner,parent-clock-frequency
  - allwinner,clock-gate
  - allwinner,reset
  - pinctrl-names
  - pinctrl-0
dt2c,device: true
