$schema: http://devicetree.org/meta-schemas/core.yaml#
title: X-Powers AXP PMIC used by SyterKit

properties:
  compatible:
    type: string
    enum:
      - x-powers,axp1530
      - x-powers,axp2101
      - x-powers,axp2202
      - x-powers,axp333
      - x-powers,axp8191
  reg:
    type: uint32-array
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg

dt2c,device: true
