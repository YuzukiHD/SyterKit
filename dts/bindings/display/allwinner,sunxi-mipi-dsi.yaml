$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner MIPI DSI host used by SyterKit

properties:
  compatible:
    const: allwinner,sunxi-mipi-dsi
  reg:
    type: reg
  allwinner,variant:
    type: string
  allwinner,dsi-id:
    type: uint32
  clock-frequency:
    type: uint32
  allwinner,module-clock:
    type: uint32-array
  allwinner,clock-gate:
    type: uint32-array
  allwinner,reset:
    type: uint32-array
  allwinner,phy:
    type: phandle
  allwinner,drive-level:
    type: uint32
  pinctrl-names:
    type: string
  pinctrl-0:
    type: phandle
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - allwinner,variant
  - allwinner,clock-gate
  - allwinner,reset

dt2c,device: true
