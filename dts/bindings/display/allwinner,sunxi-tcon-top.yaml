$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner TCON top (display interface top) used by SyterKit

properties:
  compatible:
    const: allwinner,sunxi-tcon-top
  reg:
    type: reg
  allwinner,variant:
    type: string
  allwinner,clock-gate:
    type: uint32-array
  allwinner,reset:
    type: uint32-array
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - reg
  - allwinner,variant
  - allwinner,clock-gate
  - allwinner,reset

dt2c,device: true
