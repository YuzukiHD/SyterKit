$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner LVDS output of the TCON used by SyterKit

properties:
  compatible:
    const: allwinner,sunxi-lvds
  allwinner,phy:
    type: phandle
  allwinner,reset:
    type: uint32-array
  allwinner,dual-link:
    type: boolean
  allwinner,jeida:
    type: boolean
  allwinner,drive-level:
    type: uint32
  pinctrl-names:
    type: string
  pinctrl-0:
    type: phandle
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - allwinner,phy

dt2c,device: true
