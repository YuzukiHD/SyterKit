$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Allwinner SPI controller used by SyterKit

properties:
  compatible:
    const: allwinner,sunxi-spi
  allwinner,spi-id:
    type: uint32
  reg:
    type: reg
  clock-frequency:
    type: uint32
  allwinner,module-clock:
    type: uint32-array
  allwinner,clock-gate:
    type: uint32-array
  allwinner,reset:
    type: uint32-array
  dmas:
    type: phandle-array
  dma-names:
    type: string
  allwinner,lcd-dc-gpio:
    type: phandle-array
  allwinner,lcd-reset-gpio:
    type: phandle-array
  allwinner,lcd-backlight-gpio:
    type: phandle-array
  pinctrl-names:
    type: string
  pinctrl-0:
    type: phandle
  status:
    type: string
    enum: [okay, disabled]

required:
  - compatible
  - allwinner,spi-id
  - reg
  - clock-frequency
  - allwinner,module-clock
  - allwinner,clock-gate
  - allwinner,reset
  - pinctrl-names
  - pinctrl-0

dt2c,device: true
